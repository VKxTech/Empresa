# ─── VKX Wallet — Nginx (espelho fiel de producao) ───
# Copiado de /etc/nginx/sites-available/wallet.vkxtech.com.br em 2026-09-21.
#
# ATENCAO: a versao anterior deste arquivo era um rascunho que NUNCA rodou em
# producao e que teria derrubado o site se aplicado: apontava para a porta 3000
# (que pertence ao dividicar-api, nao ao vkx-site), servia estaticos por
# try_files a partir de um root inexistente — 404 em todo CSS, fonte e imagem —
# e omitia o bloco acme-challenge, quebrando a renovacao do certificado.
#
# O app roda sob pm2 como "vkx-site" na porta 3020, a partir de
# /srv/apps/vkx-site, e serve os estaticos pelo proprio Express.
# Aplicar:  ln -s /etc/nginx/sites-available/wallet.vkxtech.com.br \
#              /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

# wallet.vkxtech.com.br -> mesmo app do apex (pm2: vkx-site, porta 3020).
# Unifica os dois dominios no mesmo codigo e no mesmo banco (vkx_site).
server {
    listen 80;
    listen [::]:80;
    server_name wallet.vkxtech.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.vkxtech.com.br;

    ssl_certificate     /etc/letsencrypt/live/wallet.vkxtech.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.vkxtech.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
    client_max_body_size 12m;
}
